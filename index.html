<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Prompt:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --felt:#123634;--felt2:#0c2826;--ink:#eef5f2;--muted:#9fbab5;--line:rgba(255,255,255,.12);
  --cream:#f4e3c1;--gold:#f6b62a;--teal:#1d4a48;--hor:#e86f86;--def:#5b1f2c;--shi:#1f3866;--con:#3b2a5a;--mas:#0f4344;
  --ok:#5fd39a;--bad:#ff6b6b;
  --fd:"Prompt","Prompt",system-ui,sans-serif;--fb:"Prompt",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--fb);color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#1b4a47 0%,var(--felt) 45%,var(--felt2) 100%);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.btn.pri{background:var(--gold);color:#2a1c00;border-color:transparent}
.btn.pri:hover:not(:disabled){background:#ffc84a}
.btn.red{background:#c2413a;border-color:transparent}
.btn.blue{background:#2f68b5;border-color:transparent}
.btn.purple{background:#6e4bb0;border-color:transparent}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.wrap{max-width:1100px;margin:0 auto;padding:10px 12px 24px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.brand{font:800 18px var(--fd);letter-spacing:.04em;color:var(--gold)}
.brand small{display:block;font:500 11px var(--fb);color:var(--muted);letter-spacing:0}
.hdr-btns{display:flex;gap:6px}
/* setup */
.panel{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.panel h2{font:700 16px var(--fd);margin:0 0 10px;color:var(--cream)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:64px}
.seat{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:13px}
.seg button.on{background:var(--gold);color:#2a1c00;font-weight:700}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.counts div{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.18);border-radius:8px;padding:5px 8px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--muted)}
.opt{display:flex;gap:8px;align-items:flex-start;margin:7px 0}
.opt input{margin-top:4px}
.opt small{display:block;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px}
/* table */
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opp{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:8px 10px;position:relative}
.opp.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(246,182,42,.35)}
.opp .nm{font:700 14px var(--fd);display:flex;gap:6px;align-items:center}
.opp .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.gchip{width:24px;height:24px;border-radius:7px;background:var(--teal) center/cover;border:1px solid rgba(255,255,255,.25);position:relative}
.gchip b{position:absolute;right:-4px;bottom:-4px;background:var(--gold);color:#2a1c00;font-size:10px;border-radius:99px;padding:0 4px;line-height:14px}
.center{display:flex;gap:14px;justify-content:center;align-items:center;margin:12px 0 6px;flex-wrap:wrap}
.pile{text-align:center;font-size:12px;color:var(--muted)}
.back{width:70px;height:98px;border-radius:10px;background:linear-gradient(135deg,#1d4a48,#0f2f2e);border:3px solid var(--cream);display:grid;place-items:center;font:800 11px var(--fd);color:var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.35);text-align:center;line-height:1.1}
.back.master{background:linear-gradient(135deg,#0f4344,#2a1a4a);border-color:var(--gold)}
.back.master.away{opacity:.35;border-style:dashed}
.back.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted)}
.status{text-align:center;font:600 14px var(--fd);margin:6px 0;min-height:22px}
.status .hint{display:block;font:400 12.5px var(--fb);color:var(--muted)}
.log{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px;font-size:12.5px;max-height:84px;overflow:auto;border:1px solid var(--line)}
.log div{padding:1px 0;color:#cfe0dc}
.log div:first-child{color:#fff;font-weight:600}
.mine{margin-top:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:10px}
.mine.turn{border-color:var(--gold)}
.mine-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mine-h .nm{font:700 15px var(--fd)}
.pairs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.pair{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.25);border-radius:9px;padding:3px 7px 3px 3px;font-size:12px}
.pair .gchip{width:22px;height:22px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hand{display:flex;flex-wrap:wrap;gap:7px;padding-top:4px}
.detail{min-height:40px;background:rgba(0,0,0,.25);border-radius:10px;padding:7px 10px;font-size:13px;margin-top:8px;white-space:pre-line}
.detail b{font-family:var(--fd)}
/* cards */
.card{width:88px;height:124px;border-radius:10px;position:relative;cursor:pointer;flex:0 0 auto;padding:5px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s;user-select:none;overflow:hidden;border:3px solid var(--cream)}
.card:hover{transform:translateY(-3px)}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 10px 18px rgba(0,0,0,.45)}
.card .ic{position:absolute;left:4px;top:4px;width:17px;height:17px;border-radius:50%;font:800 10px/17px var(--fd);color:#fff;text-align:center}
.card.gland{background:var(--teal)}
.card.gland .ic{background:#e3a823}
.card.gland img{width:66px;height:66px;object-fit:contain;margin-top:6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.card.gland .t{font:800 9.5px/1.1 var(--fd);color:var(--gold);margin-top:2px}
.card.gland .p{font-size:9px;line-height:1.15;color:var(--cream);margin-top:auto;background:rgba(244,227,193,.14);border-radius:5px;padding:1px 3px}
.card.hormone{background:linear-gradient(170deg,#24605d,#163d3b)}
.card.hormone .ic{background:var(--hor)}
.card.hormone .ab{font:800 20px/1.05 var(--fd);color:var(--gold);margin-top:22px;word-break:break-word}
.card.hormone .ab.long{font-size:13px}
.card.hormone .fl{font-size:9px;line-height:1.15;color:var(--cream);margin-top:auto;opacity:.9}
.card.sp .ic{background:rgba(0,0,0,.4)}
.card.sp .k{font:600 8.5px var(--fd);letter-spacing:.06em;opacity:.8;margin-top:20px}
.card.sp .t{font:800 15px/1.05 var(--fd);margin-top:4px}
.card.sp .b{font-size:8.6px;line-height:1.2;margin-top:auto;opacity:.92}
.card.def{background:var(--def);border-color:#f1b11f}
.card.shi{background:var(--shi);border-color:#9fd8d3}
.card.con{background:var(--con);border-color:var(--gold)}
.card.mini{width:60px;height:84px;padding:3px;border-width:2px;cursor:default}
.card.mini:hover{transform:none}
.card.mini img{width:44px;height:44px;margin-top:4px}
.card.mini .ab{font-size:14px;margin-top:14px}
.card.mini .fl,.card.mini .b,.card.mini .p{display:none}
.card.mini .t{font-size:8px}
.card.mini.sp .t{font-size:10px}
.card.art{padding:0;border:0;background:#0003;border-radius:7px}
.card.art img{width:100%;height:100%;object-fit:cover;margin:0;border-radius:7px;filter:none;display:block}
.card.art.mini{width:60px;height:84px}
.card.art.mini img{width:60px;height:84px}
.pileimg{width:70px;height:98px;border-radius:7px;display:block;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.pileimg.away{opacity:.35}
.bigcard{display:block;width:min(360px,82vw);margin:0 auto;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.preview{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.preview img{width:76px;height:106px;border-radius:6px;cursor:zoom-in}
.loading{position:fixed;inset:0;background:rgba(3,14,13,.85);display:grid;place-items:center;z-index:70;font:600 16px var(--fd);text-align:center}
@media (max-width:560px){.pileimg{width:58px;height:81px}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,14,13,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{background:#14302e;border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal.wide{max-width:900px}
.modal h3{font:700 17px var(--fd);margin:0 0 8px;color:var(--cream)}
.modal .opts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.modal .opts .btn{text-align:left}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mg{background:rgba(0,0,0,.25);border-radius:12px;padding:8px;display:grid;grid-template-columns:48px 1fr;gap:8px}
.mg img{width:48px;height:48px;object-fit:contain}
.mg h4{margin:0;font:700 13px var(--fd);color:var(--gold)}
.mg .th{font-size:11.5px;color:var(--muted)}
.mg ul{margin:4px 0 0;padding-left:16px;font-size:12px}
.rules h4{font:700 14px var(--fd);color:var(--gold);margin:12px 0 4px}
.rules ul{margin:0;padding-left:18px}
.rules li{margin:2px 0}
.interp{color:#ffd88a}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b1515;border:1px solid #c2413a;color:#ffd9d6;padding:9px 14px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw;text-align:center}
.toast.good{background:#123a29;border-color:var(--ok);color:#d8ffe9}
.stats{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.stats th,.stats td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center}
.stats th:first-child,.stats td:first-child{text-align:left}
.badge{font-size:11px;background:var(--gold);color:#2a1c00;border-radius:99px;padding:0 6px;font-weight:700}
.badge.sk{background:#ffb74d}
.badge.pk{background:#8b5cc4;color:#fff}
@media (max-width:560px){.card{width:76px;height:108px}.card.gland img{width:54px;height:54px}.card.hormone .ab{font-size:17px}.card.sp .t{font-size:13px}.back{width:58px;height:82px}}
</style>
<style>
.sets{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.set{display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;padding:2px 6px 2px 2px;font-size:11.5px;max-width:100%}
.set .gchip{width:22px;height:22px;flex:0 0 auto}
.set small{color:var(--muted)}
.timer{font:700 13px var(--fd);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.timer.final{background:#c2413a;border-color:transparent}
.timer.warn{background:#d6332b;border-color:#ffb3a8;color:#fff;animation:tblink 1s steps(2,jump-none) infinite;box-shadow:0 0 12px rgba(255,60,50,.7)}
.timer.crit{animation-duration:.5s}
@keyframes tblink{50%{background:#5a0d0a;box-shadow:none;opacity:.75}}
.winscr{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;
  background:radial-gradient(circle at 50% 38%,rgba(255,216,100,.35),transparent 55%),radial-gradient(circle,#0f3d3a,#061716 75%);overflow:hidden;animation:fadein .4s forwards;opacity:0}
.winscr .rays{position:absolute;left:50%;top:38%;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,230,150,.10) 0 10deg,transparent 10deg 20deg);transform:translate(-50%,-50%);animation:spin 40s linear infinite;pointer-events:none}
.winscr>*:not(.rays):not(.conf){position:relative}
.wtitle{font:900 clamp(40px,12vw,76px)/1 "Kanit","Prompt",sans-serif;letter-spacing:2px;background:linear-gradient(180deg,#fff7d1,#ffd864 40%,#f6a51a 65%,#c66f0c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #5a2a00;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:ttlin .7s cubic-bezier(.3,1.6,.5,1)}
.wsub{font:700 15px var(--fd);color:#ffe9a8;letter-spacing:1px}
.wava{width:120px;height:120px;border-radius:50%;border:5px solid #ffd864;box-shadow:0 0 0 6px rgba(255,216,100,.25),0 0 40px rgba(255,216,100,.6);background:#0b2a28;display:grid;place-items:center;overflow:hidden;animation:empop .8s .2s both cubic-bezier(.3,1.6,.5,1)}
.wava img{width:100%;height:100%;object-fit:cover}.wava .ava{width:100%;height:100%;font-size:54px;display:grid;place-items:center;border:0}
.wcrown{font-size:46px;margin-bottom:-26px;z-index:2;animation:bobE 1.6s ease-in-out infinite}
.wname{font:900 26px var(--fd);color:#fff}
.wscore{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wscore div{background:rgba(0,0,0,.35);border:1px solid rgba(255,216,100,.4);border-radius:12px;padding:8px 14px;font:700 12px var(--fd);color:#cfe}
.wscore b{display:block;font:900 22px var(--fd);color:#ffd864}
.wbtns{display:flex;flex-direction:column;gap:8px;width:min(320px,90vw);margin-top:6px}
.wbtns .btn{width:100%}
.conf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:confall linear forwards;pointer-events:none}
@keyframes confall{to{transform:translateY(110vh) rotate(720deg)}}
.ref{font-size:11px;color:var(--muted);margin-top:2px}
.chal{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:65;background:#3b1414;border:2px solid #ff6b6b;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:94vw}
.chal .bar{height:4px;background:#ff6b6b;border-radius:3px;margin-top:5px;transition:width linear}
.hp{font-size:11px;color:var(--gold)}
.seats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seatbox{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:7px 10px;min-width:150px;text-align:center}
.seatbox.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,182,42,.25),0 0 18px rgba(246,182,42,.3)}
.seatbox .nm{font:700 14px var(--fd);justify-content:center;display:flex;gap:5px;align-items:center}
.seatbox .meta{font-size:12px;color:var(--muted)}
.backs{display:flex;justify-content:center;align-items:center;height:50px;margin:4px 0}
.backs img{width:32px;height:45px;border-radius:3px;margin-left:-20px;box-shadow:-2px 2px 4px rgba(0,0,0,.45)}
.backs img:first-child{margin-left:0}
.backs .more{font-size:11px;color:var(--cream);margin-left:4px}
.tablez{margin:10px 0;padding:14px 10px 12px;border-radius:26px;background:radial-gradient(ellipse at 50% 40%,#21625d,#143f3c 70%);border:4px solid #8a6a2a;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.35)}
.tz-top{display:flex;justify-content:center;align-items:center;gap:clamp(14px,5vw,48px)}
.cpile{position:relative;width:118px;height:165px}
.cpile .pc{position:absolute;left:0;top:0;width:118px;height:165px;border-radius:9px;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.cpile .pc.top{box-shadow:0 0 0 3px var(--gold),0 10px 22px rgba(0,0,0,.55)}
@keyframes land{from{transform:translate(0,-60px) scale(1.15) rotate(-14deg);opacity:.2}}
.cplabel{text-align:center;font-size:12.5px;color:var(--cream);margin-top:6px}
.lastcap{text-align:center;margin:8px auto 0;background:rgba(0,0,0,.3);border-radius:99px;padding:5px 14px;width:fit-content;max-width:100%;font-size:13.5px;cursor:pointer}
.tsets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.tset{text-align:center}
.tset .own{font-size:11px;color:var(--muted);margin-bottom:1px}
.tset.mineset .fan{border-color:var(--gold);background:rgba(246,182,42,.12)}
.tset.mineset .own{color:var(--gold)}
@media (max-width:560px){.cpile,.cpile .pc{width:92px;height:128px}}

.fan{display:inline-flex;align-items:flex-end;padding:5px 8px 17px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;position:relative;cursor:zoom-in;margin:2px}
.fan img{width:42px;height:59px;border-radius:4px;margin-left:-27px;box-shadow:-2px 2px 5px rgba(0,0,0,.45)}
.fan img:first-child{margin-left:0}
.mine .fan img{width:56px;height:78px;margin-left:-34px}
.mine .fan img:first-child{margin-left:0}

.plays{display:flex;flex-direction:column;gap:5px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:8px}
.pl{display:flex;align-items:center;gap:8px;justify-content:space-between;opacity:.75;cursor:zoom-in;border-radius:8px;padding:2px 4px}

.pl.bad .pl-t{color:#ffb4b0}
.pl-t{font-size:13px;flex:1}
.pl-c{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.pl-c img{width:34px;height:48px;border-radius:3px}
.pl.new .pl-c img{width:46px;height:64px}
.logbox{margin-top:6px}.logbox summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.playpop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:62;pointer-events:none;background:rgba(10,30,29,.94);border:3px solid var(--gold);border-radius:18px;padding:12px 16px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.6);animation:ppin .25s ease-out,ppout .35s ease-in forwards;animation-delay:0s,calc(var(--d,1.3s));max-width:94vw}
.playpop.bad{border-color:#ff6b6b}
.pp-cap{font:600 15px var(--fd);margin-bottom:8px}
.pp-cards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pp-cards img{width:clamp(70px,20vw,110px);height:auto;aspect-ratio:744/1039;border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.5);animation:cardin .35s ease-out both}
@keyframes ppin{from{opacity:0;transform:translate(-50%,-40%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* ---------- background removal ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function hueOf(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;return h<0?h+360:h}
function hueDiff(a,b){const d=Math.abs(a-b)%360;return d>180?360-d:d}
function morph(m,w,h,r,isDil){const t=new Uint8Array(m.length),o=new Uint8Array(m.length);
  for(let y=0;y<h;y++){const row=y*w;for(let x=0;x<w;x++){let v=isDil?0:1;for(let k=-r;k<=r;k++){const xx=x+k;if(xx<0||xx>=w)continue;const q=m[row+xx];if(isDil?q:!q){v=isDil?1:0;break}}t[row+x]=v}}
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){let v=isDil?0:1;for(let k=-r;k<=r;k++){const yy=y+k;if(yy<0||yy>=h)continue;const q=t[yy*w+x];if(isDil?q:!q){v=isDil?1:0;break}}o[y*w+x]=v}}return o}
function floodBorder(bar,w,h){const N=w*h,seen=new Uint8Array(N),q=new Int32Array(N);let qh=0,qt=0;
  const push=i=>{if(!bar[i]&&!seen[i]){seen[i]=1;q[qt++]=i}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
  while(qh<qt){const i=q[qh++],x=i%w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(i>=w)push(i-w);if(i<N-w)push(i+w)}return seen}
function keepBig(fg,w,h,frac){const N=w*h,lab=new Int32Array(N),q=new Int32Array(N),sizes=[0];let n=0;
  for(let s=0;s<N;s++){if(!fg[s]||lab[s])continue;n++;let qh=0,qt=0;q[qt++]=s;lab[s]=n;let cnt=0;
    while(qh<qt){const i=q[qh++];cnt++;const x=i%w,y=(i-x)/w;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;const j=yy*w+xx;if(fg[j]&&!lab[j]){lab[j]=n;q[qt++]=j}}}sizes.push(cnt)}
  const mx=Math.max(0,...sizes);const keep=sizes.map(v=>v>=mx*frac&&v>0);const out=new Uint8Array(N);for(let i=0;i<N;i++)out[i]=lab[i]&&keep[lab[i]]?1:0;return out}
async function removeBg(src,tol){
  const img=await loadImg(src);const sc=Math.min(1,900/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.drawImage(img,0,0,w,h);
  const id=x.getImageData(0,0,w,h),d=id.data,N=w*h;
  const rs=[],gs=[],bs=[];let tr=0;const pb=i=>{if(d[i*4+3]<20){tr++;return}rs.push(d[i*4]);gs.push(d[i*4+1]);bs.push(d[i*4+2])};
  for(let X=0;X<w;X++){pb(X);pb((h-1)*w+X)}for(let Y=0;Y<h;Y++){pb(Y*w);pb(Y*w+w-1)}
  let fg;
  if(tr>w+h){fg=new Uint8Array(N);for(let i=0;i<N;i++)fg[i]=d[i*4+3]>20?1:0}
  else{
    const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1]};const br=med(rs),bgc=med(gs),bb=med(bs);
    const bgCh=Math.max(br,bgc,bb)-Math.min(br,bgc,bb),bgH=hueOf(br,bgc,bb);
    let bar=new Uint8Array(N);
    for(let i=0;i<N;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];if(d[i*4+3]<20)continue;const dr=r-br,dg=g-bgc,db=b-bb;let ok=Math.sqrt(dr*dr+dg*dg+db*db)<tol;
      if(ok&&bgCh>18){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx<110&&((mx-mn)<14||hueDiff(hueOf(r,g,b),bgH)>35))ok=false}
      bar[i]=ok?0:1}
    bar=morph(morph(bar,w,h,2,true),w,h,2,false);
    const bgm=floodBorder(bar,w,h);fg=new Uint8Array(N);for(let i=0;i<N;i++)fg[i]=bgm[i]?0:1;
    fg=keepBig(fg,w,h,.12);const bg2=floodBorder(fg,w,h);for(let i=0;i<N;i++)fg[i]=bg2[i]?0:1;
  }
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=y*w+X;let s=0,c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=X+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;s+=fg[yy*w+xx];c++}

function intern(v){let i=HX.tbl.get(v);if(i===undefined){i=HX.rev.length;HX.rev.push(v);HX.tbl.set(v,i)}return"\u0001"+i}

function unsnap(s){return JSON.parse(s,(k,v)=>typeof v==="string"&&v.charCodeAt(0)===1?HX.rev[+v.slice(1)]:v)}
function updHist(){$("undoBtn").disabled=HX.ptr<=0;$("redoBtn").disabled=HX.ptr>=HX.stack.length-1}
function commit(){clearTimeout(HX.t);HX.t=0;if(!deck)return;const s=snap();if(HX.stack[HX.ptr]===s){updHist();return}HX.stack=HX.stack.slice(0,HX.ptr+1);HX.stack.push(s);if(HX.stack.length>100)HX.stack.shift();HX.ptr=HX.stack.length-1;updHist()}

function buildDeck(){

  D.hormones.forEach(h=>d.push({u:++uidN,kind:"hormone",hid:h.id}));
  D.hormones.forEach(h=>d.push({u:++uidN,kind:"gland",gid:h.g}));

function drawCards(p,n){
  let got=0;sfx("draw",n);
  for(let i=0;i<n;i++){
    if(!G.deck.length){
      // เก็บใบอ้างอิง (Gland/Hormone ล่าสุด) และใบบนสุดไว้เป็นกองกลางต่อ
      const ref=refCard(),top=G.discard[G.discard.length-1];
      const keep=[ref,top!==ref?top:null].filter(Boolean);
      const rest=G.discard.filter(c=>!keep.includes(c));
      if(!rest.length)break;
      G.deck=shuffle(rest);G.discard=keep;log("กองจั่วหมด → สับกองทิ้งเป็นกองจั่วใหม่");
    }
    p.hand.push(G.deck.pop());got++;
  }
  p.st.drawn+=got;sortHand(p);return got;
}

/* ---------- main loop ---------- */
async function loop(){
  const e=epoch;
  try{
    while(!G.over){
      while(G.pauseP)await G.pauseP;if(e!==epoch)return;
      await takeTurn(G.players[G.cur]);
      if(e!==epoch)return;
      if(G.over)break;
      if(!G.finalRound&&timeLeft()<=0){G.finalRound=true;log("⏰ หมดเวลา — เล่นต่อให้ครบรอบโต๊ะ");}
      if(G.finalRound&&nextIdx(G.cur)===G.first){endByHP();break}
      if(G.turnsPlayed>2000){endByHP();break}
      G.cur=nextIdx(G.cur);
    }
  }catch(err){if(err!=="abort")console.error(err);return}
  if(e!==epoch)return;
  clearInterval(tick);renderGame();showEnd();musicForScreen();
}
function endByHP(){
  const r=G.players.slice().sort((a,b)=>netScore(b)-netScore(a)||a.hand.length-b.hand.length||tableCount(b)-tableCount(a));
  log(`⏰ จบเกมตามเวลา — ${r[0].name} คะแนนสุทธิสูงสุด ${netScore(r[0]).toLocaleString()} (ลงได้ ${(r[0].score||0).toLocaleString()} − HP ในมือ ${handHP(r[0])}) ชนะ`);
  finish(r[0],"time");
}
async function takeTurn(p){
  G.turnNo++;G.turnsPlayed++;
  p.turn={placed:false,special:false,drew:false,discarded:false,sets:0};G.lastAct[p.idx]=null;
  sel.clear();
  if(p.human)await ensureViewer(p.idx,`ตาของ ${p.name}`);
  else if(humansCount()>1)G.viewer=null;
  if(p.skip){p.skip=false;setAct(p,"ถูกข้ามตา ⏭");log(`⏭ ${p.name} ถูก SKIP ข้ามตานี้`);renderGame();await sleep(S.speed)}
  else{
    renderGame();
    if(p.human)await new Promise(r=>{humanDone=r;renderGame()});
    else await botTurn(p);
  }
  if(G.over)return;
  if(G.master.holder===p.idx){if(G.master.left>0)G.master.left--;else{G.master={holder:null,mode:null};log(`${p.name} วาง Master คืนกลางโต๊ะ`)}}
  renderGame();
}

/* ---------- placing: set / lay-off / discard (with check modes) ---------- */
function refGid(){const r=refCard();return r?gidOf(r):null}
// แบ่งการ์ดที่ลงเป็นกลุ่มตามต่อมจริง: กลุ่มที่มี Gland = คู่/ชุด (ลงได้ทุกเมื่อ) · กลุ่มที่ไม่มี Gland ต้องเป็นต่อมเดียวกับบนสุด
function analyzePlay(cs){
  if(!cs.length||cs.some(c=>c.kind==="special"))return{ok:false,groups:[],pairs:0};
  const rg=refGid(),by={},keys=[];
  cs.forEach(c=>{const g=gidOf(c);if(!by[g]){by[g]=[];keys.push(g)}by[g].push(c)});
  const groups=[];let ok=true;
  keys.forEach(g=>{const arr=by[g],hasG=arr.some(c=>c.kind==="gland");
    if(hasG)groups.push({gid:g,cards:arr,set:true,pair:arr.some(c=>c.kind==="hormone")});
    else if(g===rg)groups.push({gid:g,cards:arr,set:false});
    else ok=false});
  const pairs=groups.filter(x=>x.set&&x.pair).length,bare=groups.filter(x=>x.set&&!x.pair).length;let reason="";
  if(!ok)reason="hormone";
  else if(bare>1){ok=false;reason="bare"}          // Gland เดี่ยว (ไม่มี Hormone คู่) ลงได้ทีละชนิด
  else if(bare&&pairs){ok=false;reason="mixed"}    // ลงคู่ Gland+Hormone แล้ว ห้ามแถม Gland เดี่ยว
  return{ok,groups,pairs,reason};
}
function oddCards(cs){const an=analyzePlay(cs),ok=new Set(an.groups.flatMap(g=>g.cards));return cs.filter(c=>!ok.has(c))}
function comboName(n){return n>=4?"QUADRUPLE MATCH!":n===3?"TRIPLE MATCH!":n===2?"DOUBLE MATCH!":""}
function comboMult(n){return n>=2?Math.min(n,4):1}
function netScore(p){return (p.score||0)-handHP(p)}
function addScore(p,pts,why){if(!pts)return;p.score=(p.score||0)+pts;G.lastScore={idx:p.idx,pts,t:Date.now(),why}}
function playKind(cs){if(!cs.length||cs.some(c=>c.kind==="special"))return null;
  const gl=cs.find(c=>c.kind==="gland");
  if(gl)return cs.every(c=>gidOf(c)===gl.gid)?"set":"bad";      // มี Gland = เปลี่ยนต่อม (ลงได้ทุกเมื่อ)
  const rg=refGid();return cs.every(c=>gidOf(c)===rg)?"match":"bad"} // Hormone ล้วน = ต้องต่อมเดียวกับบนสุด
function claimKind(cs){return cs.some(c=>c.kind==="gland")?"set":"match"}
async function playCards(p,cards){
  const ref0=refCard();const an=analyzePlay(cards);const ok=an.ok;const claim=cards.some(c=>c.kind==="gland")?"set":"match";
  const what=`ลง ${cards.map(cardName).join(" + ")} บน ${ref0?cardName(ref0):"-"}`;

  G.discard.push(...order);G.lastPlay[p.idx]=order;

  const pairs=ok?an.pairs:0,combo=comboName(pairs),lastG=order.length?gidOf(order[order.length-1]):null;
  const parts=(an.groups||[]).map(g=>g.set?(g.pair?`${GL[g.gid].en} + ${g.cards.filter(c=>c.kind==="hormone").map(c=>HM[c.hid].abbr).join(", ")} (คู่)`:`${GL[g.gid].en} เดี่ยว (ไม่นับคะแนน)`):`${g.cards.map(c=>HM[c.hid].abbr).join(", ")} ต่อ ${GL[g.gid].en}`);
  const label=combo?`${combo} ${pairs} คู่ (${cards.length} ใบ)`:claim==="set"?`เปลี่ยนต่อมเป็น ${GL[lastG].en}${parts.length>1||cards.length>1?" · "+parts.join(" · "):""}`:`ลงต่อ ${cards.length} ใบ`;
  log(`✅ ${p.name} ${label}: ${cards.map(cardName).join(" + ")}`);setAct(p,combo?`${combo.replace("!","")} 🔥`:claim==="set"?`เปลี่ยนต่อม · ลง ${cards.length} ใบ`:`ลง ${cards.length} ใบ`);
  const bareG=new Set(ok?an.groups.filter(g=>g.set&&!g.pair).map(g=>g.gid):[]);
  const mult=comboMult(pairs),pts=cards.reduce((a,c)=>a+(c.kind==="gland"&&bareG.has(c.gid)?0:HPof(c)),0)*mult;addScore(p,pts,combo?combo+" ×"+mult:"ลงการ์ด");
  sfx(combo?"combo":claim==="set"?"gland":"hormone");
  announce(p,label+(pts?` · +${pts} คะแนน`:" · Gland เดี่ยว ไม่นับคะแนน"),order,combo?{pop:true,force:true,combo:true}:{});renderGame();
  if(S.check==="challenge"){
    const ch=await challengeWindow(p,cards,ok,ref0);
    if(ch!=null){

      if(!ok){order.forEach(x=>{const i=G.discard.lastIndexOf(x);if(i>=0)G.discard.splice(i,1)});delete G.lastPlay[p.idx];p.hand.push(...cards);sortHand(p);drawCards(p,2);p.st.caught++;c.st.chalOk++;p.st.cardsPlayed-=cards.length;p.score-=pts;
        log(`🚨 ${c.name} ทัก “ผิด!” — ถูกต้อง ${p.name} เก็บการ์ดคืน + จั่วโทษ 2`);announce(c,`ทัก “ผิด!” สำเร็จ — ${p.name} เก็บคืน + จั่ว 2`,cards,{bad:true,force:true,pop:true});renderGame();await restoreViewer();return false}
      drawCards(c,2);c.st.chalBad++;log(`🚨 ${c.name} ทัก “ผิด!” — แต่ลงถูก ${c.name} จั่วโทษ 2`);announce(c,"ทัก “ผิด!” แต่ลงถูก — คนทักจั่ว 2",cards,{bad:true,force:true,pop:true});
    }else if(!ok)p.st.wrong++;
  }
  if(ok)G.players.forEach(b=>{if(!b.human)cards.forEach(c=>{if(c.kind==="hormone"&&Math.random()<.5)b.know.add(c.hid)})}); // บอทจำจากที่เห็นคนอื่นลงถูก
  if(canSee(p)&&!p.human)p.hand.forEach(c=>{if(c.kind==="hormone")p.know.add(c.hid)});
  if(ok){an.groups.filter(g=>g.set&&g.pair).forEach(g=>p.setGlands.add(g.gid));checkFree(p)}
  renderGame();await restoreViewer();
  checkWin(p);return true;
}
function checkFree(p){
  if(!p.gotFree&&p.setGlands.size>=3){p.gotFree=true;setMaster(p,"next");log(`⭐ ${p.name} ลงชุดครบ 3 ต่อม ได้ดู Master ฟรี (ถึงตาถัดไป)`)}

async function challengeWindow(p,cards,ok,ref0){
  const rel=[...cards];if(ref0)rel.push(ref0);
  const hids=rel.filter(c=>c&&c.kind==="hormone").map(c=>c.hid);
  for(const b of shuffle(G.players.filter(x=>!x.human&&x.idx!==p.idx))){
    const knowsAll=canSee(b)||hids.every(h=>b.know.has(h));
    const pr=!ok&&knowsAll?.9:ok&&!knowsAll?.03:0;
    if(Math.random()<pr){await sleep(S.speed/2);return b.idx}
  }
  const hs=G.players.filter(x=>x.human&&x.idx!==p.idx);
  if(!hs.length)return null;
  const r=await new Promise(res=>{
    const d=document.createElement("div");d.className="chal";
    d.innerHTML=`<div><b>${esc(p.name)}</b> ลง ${esc(cards.map(cardName).join(" + "))}${ref0?" บน "+esc(cardName(ref0)):""}<div class="bar" style="width:100%"></div></div><button class="btn red">ทัก “ผิด!”</button>`;
    document.body.appendChild(d);
    const bar=d.querySelector(".bar");requestAnimationFrame(()=>{bar.style.transitionDuration="3.5s";bar.style.width="0%"});
    const t=setTimeout(()=>{d.remove();res(null)},3500);
    d.querySelector("button").onclick=()=>{clearTimeout(t);d.remove();res(true)};
  });
  if(!r)return null;
  if(hs.length===1)return hs[0].idx;
  return await modal("<h3>ใครทัก?</h3>",hs.map(h=>({label:esc(h.name),value:h.idx})));
}
function lastPlayOK(x){const lp=G.lastPlay[x.idx];return lp&&lp.length&&lp.every(c=>G.discard.includes(c))}

async function applyAttack(a){

    case "steal":setMaster(f,"end");log(`🦊 ${f.name} แย่ง Master จาก ${t.name} (ใช้ได้ถึงจบตาถัดไป)`);break;

  }
}

const THINK={fast:[1000,2000],normal:[2500,5000],real:[5000,10000]};
async function botThink(p){
  if(S.think==="x")return; // โหมดทดสอบ
  const first=G.turnsPlayed<=1;const r=first?[5000,10000]:(THINK[S.think]||THINK.normal);
  const ms=r[0]+Math.random()*(r[1]-r[0]);
  G.thinking={idx:p.idx,until:Date.now()+ms};renderGame();
  await sleep(ms);G.thinking=null;
}
async function botTurn(p){
  await botThink(p);
  const knows=hid=>canSee(p)||p.know.has(hid);
  const guess={};
  const belief=c=>{if(c.kind==="gland")return c.gid;if(c.kind!=="hormone")return null;if(knows(c.hid))return HM[c.hid].g;
    if(!(c.u in guess))guess[c.u]=Math.random()<.12?pick(D.glands).id:null;return guess[c.u]};
  const unknownN=()=>p.hand.filter(c=>c.kind==="hormone"&&!knows(c.hid)).length;
  if(canSee(p))p.hand.forEach(c=>{if(c.kind==="hormone")p.know.add(c.hid)});
  const bestPlay=()=>{
    const r=refCard();const rg=r?(r.kind==="gland"?r.gid:(knows(r.hid)?HM[r.hid].g:null)):null;
    const match=rg?p.hand.filter(c=>c.kind==="hormone"&&belief(c)===rg):[];
    const sets=[];
    for(const gid of new Set(p.hand.filter(c=>c.kind==="gland").map(c=>c.gid))){
      const hs=p.hand.filter(c=>c.kind==="hormone"&&belief(c)===gid&&!match.includes(c));
      sets.push({gid,pair:hs.length>0,cards:[...p.hand.filter(c=>c.kind==="gland"&&c.gid===gid),...hs]});
    }
    const pairsets=sets.filter(x=>x.pair);
    if(pairsets.length)return[...match,...pairsets.flatMap(x=>x.cards)];   // ลงหลายคู่พร้อมกัน (combo)
    if(match.length)return match;
    return sets.length?sets.sort((a,b)=>b.cards.length-a.cards.length)[0].cards:[];
  };
  const pickSpecial=(urgentOnly)=>{
    const sp=p.hand.filter(c=>c.kind==="special");if(!sp.length)return null;
    const opp=G.players.filter(x=>x.idx!==p.idx),leader=opp.reduce((a,b)=>b.hand.length<a.hand.length?b:a);
    const has=a=>sp.find(c=>c.act===a);
    if(p.hand.length===1&&S.lastSpecialWins&&!SHIELDS.includes(sp[0].act))return sp[0];
    if(leader.hand.length<=2){for(const a of["draw6","draw4","draw2","skip","swap","destroy"])if(has(a)&&(a!=="destroy"||lastPlayOK(leader))&&(a!=="swap"||p.hand.length-1>leader.hand.length))return has(a)}
    if(urgentOnly)return null;
    if(has("consult")&&unknownN()>=2&&G.master.holder==null)return has("consult");
    if(has("steal")&&unknownN()>=2&&G.master.holder!=null&&G.master.holder!==p.idx)return has("steal");
    if(has("swap")&&leader.hand.length+2<=p.hand.length-1)return has("swap");
    for(const a of["draw6","draw4","draw2","skip"])if(has(a))return has(a);
    if(has("destroy")&&lastPlayOK(leader))return has("destroy");
    return null;
  };
  const useSpecial=async c=>playSpecial(p,c,async ts=>ts.reduce((a,b)=>b.hand.length<a.hand.length?b:a).idx);
  // 1 การกระทำต่อตา: ลงการ์ด หรือ การ์ดพิเศษ 1 ใบ หรือ จั่ว
  const urgent=pickSpecial(true);
  if(urgent&&await useSpecial(urgent))return;
  const cs=bestPlay();
  if(cs.length){await playCards(p,cs);return}
  const sp=pickSpecial(false);
  if(sp&&await useSpecial(sp))return;
  if(G.over)return;
  {const st=p.hand.find(c=>c.act==="steal"),co=p.hand.find(c=>c.act==="consult");
   if(st&&G.master.holder!=null&&G.master.holder!==p.idx&&await useSpecial(st))return;
   if(co&&G.master.holder==null&&await useSpecial(co))return;
   if(G.over)return;}
  {const order=["heal","consult","steal","swap","block","destroy","reflect","skip","draw2","draw4","draw6"];
   const rest=p.hand.filter(c=>c.kind==="special").sort((a,b)=>order.indexOf(a.act)-order.indexOf(b.act));
   const keepShield=p.hand.length>=5&&rest.length===1&&["block","reflect"].includes(rest[0].act);
   if(rest.length&&!keepShield){await discardSpecial(p,rest[0]);return}}
  await flyCards($("#bDeck"),seatEl(p),[{back:true}],480);const bf=new Set(p.hand);drawCards(p,1);p.turn.drew=true;const dc=p.hand.find(x=>!bf.has(x));setAct(p,"ลงไม่ได้ → จั่ว 1");log(`${p.name} จั่ว 1 ใบ`);announce(p,"ลงไม่ได้ → จั่ว 1 ใบ",[{back:true}]);renderGame();await sleep(S.speed);
  if(dc&&dc.kind==="special"&&!SHIELDS.includes(dc.act)&&(p.hand.length>1||S.lastSpecialWins)&&await useSpecial(dc))return;
  const cs2=bestPlay();if(cs2.length)await playCards(p,cs2);
}
async function botRespond(t,a){
  await sleep(S.speed/2);
  const refl=t.hand.find(c=>c.act==="reflect"),blk=t.hand.find(c=>c.act==="block");
  const stacks=S.stack&&DRAWN[a.type]?t.hand.filter(c=>DRAWN[c.act]):[];
  let worth;
  switch(a.type){case "steal":worth=G.master.holder===t.idx;break;case "swap":worth=G.players[a.from].hand.length>t.hand.length;break;case "skip":worth=t.hand.length<=4;break;case "destroy":worth=true;break;default:worth=a.amount>=2}

    const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();

      const x0=a.left+a.width/2-W/2+(i-(cards.length-1)/2)*18,y0=a.top+a.height/2-H/2;
      Object.assign(im.style,{width:W+"px",height:H+"px",left:x0+"px",top:y0+"px",transitionDelay:i*70+"ms"});document.body.appendChild(im);
      return{im,dx:b.left+b.width/2-W/2-x0+(i-(cards.length-1)/2)*8,dy:b.top+b.height/2-H/2-y0}});
    requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(({im,dx,dy},i)=>{im.style.transform=`translate(${dx}px,${dy}px) rotate(${(i-1)*7}deg)`})));

function handCW(){return window.innerHeight<=600?62:window.innerWidth<=560?72:86}
function fanCalc(n,Wo){

  const n=Math.round(L*sr),d=buf.getChannelData(0),out=c.createBuffer(1,n,sr),o=out.getChannelData(0);
  for(let i=0;i<n;i++)o[i]=d[i];for(let i=n;i<d.length&&i-n<n;i++)o[i-n]+=d[i]; // พับหางเสียงกลับมาต้นลูป ให้ต่อเนียน

function musicPlay(id){
  musicStop();id=id||S.music;if(id==="off")return;
  if(id==="custom"){if(!customURL)return;MUS.audio=new Audio(customURL);MUS.audio.loop=true;MUS.audio.volume=S.vol;MUS.audio.play().catch(()=>{});MUS.on=true;MUS.cur=id;updMusicBtn();return}
  const c=mctx(),tr=TRACKS[id];if(!c||!tr)return;
  MUS.out.gain.cancelScheduledValues(c.currentTime);MUS.out.gain.setValueAtTime(S.vol,c.currentTime);
  MUS.on=true;MUS.cur=id;const tok=MUS.tok;updMusicBtn();
  renderTrack(id).then(buf=>{if(MUS.tok!==tok||!MUS.on)return;const src=c.createBufferSource();src.buffer=buf;src.loop=true;src.connect(MUS.out);src.start(c.currentTime+.03);MUS.src=src})
   .catch(()=>{if(MUS.tok!==tok)return;MUS.step=0;MUS.next=c.currentTime+.08;
     MUS.timer=setInterval(()=>{if(document.hidden)return;while(MUS.next<c.currentTime+.15){schedStep(tr,MUS.step,MUS.next);MUS.next+=60/tr.bpm/4;MUS.step++}},25)});
}

  </div>
  <div class="row" style="justify-content:center"><button class="btn pri big" id="start">เริ่มเกม ▶</button></div>`;
  $("#nP").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=+b.dataset.v;while(S.seats.length<n)S.seats.push({name:BOTNAMES[(S.seats.length-1)%4],human:false});S.seats.length=n;saveS();renderMulti()};
  document.querySelectorAll("[data-name]").forEach(el=>el.oninput=()=>{S.seats[+el.dataset.name].name=el.value;saveS()});
  document.querySelectorAll("[data-seat]").forEach(el=>el.onclick=e=>{const b=e.target.closest("button[data-h]");if(!b)return;const i=+el.dataset.seat,h=b.dataset.h==="1";S.seats[i].human=h;
    if(h&&/^บอท/.test(S.seats[i].name))S.seats[i].name="เพื่อน "+i;if(!h&&/^เพื่อน/.test(S.seats[i].name))S.seats[i].name=BOTNAMES[(i-1)%4];saveS();renderMulti()});
  $("#allBot").onclick=()=>{S.seats.forEach((s,i)=>{if(i){s.human=false;s.name=BOTNAMES[(i-1)%4]}});saveS();renderMulti()};
  $("#allFriend").onclick=()=>{S.seats.forEach((s,i)=>{if(i){s.human=true;s.name="เพื่อน "+i}});saveS();renderMulti()};
  $("#bBack").onclick=()=>go("mode");
  $("#start").onclick=()=>{if(S.seats.length*handSize()+10>totalCards()){toast("การ์ดไม่พอสำหรับแจก");return}newGame()};
}
function renderSettings(){
  const sp=Object.keys(DEF_COUNTS);
  $("#app").innerHTML=`<header><div class="brand">ตั้งค่า<small>กติกา · ดีไซน์การ์ด · บอท</small></div><div class="hdr-btns"><button class="btn sm" id="bRules">กติกา</button><button class="btn sm" id="bBack">← กลับ</button></div></header>
  <div class="panel"><h2>บอท</h2><div class="row"><label>บอทรู้คำตอบก่อนเริ่ม</label><select id="skill"><option value="easy">มือใหม่ ~30%</option><option value="mid">ปานกลาง ~55%</option><option value="pro">เซียน ~85%</option></select>
      <label>เวลาคิดของบอท</label><select id="think"><option value="fast">เร็ว 1–2 วิ</option><option value="normal">ปกติ 2.5–5 วิ</option><option value="real">สมจริง 5–10 วิ</option></select>
      <label>ความเร็วบอท</label><select id="speed"><option value="1500">ช้า</option><option value="1000">ปกติ</option><option value="500">เร็ว</option></select></div></div>
  <div class="panel"><h2>ดีไซน์การ์ด</h2>
    <div class="note">ตอนนี้ใช้: <b style="color:var(--cream)">${userDeckRaw?"ไฟล์ของคุณ · "+esc(userDeckName):"ดีไซน์ตั้งต้นของ Card Studio"}</b></div>
    <div class="preview" id="pv">${artReady?["g-adr","h-fsh","x-destroy","x-reflect","x-consult","master"].filter(k=>ART[k]).map(k=>`<img src="${ART[k]}" data-k="${k}" alt="">`).join(""):'<span class="note">กำลังวาดตัวอย่าง…</span>'}</div>
    <p class="note">ใน Card Studio กด “บันทึกไฟล์ .json” แล้วนำเข้าที่นี่ เพื่อใช้ดีไซน์ล่าสุดของคุณ</p>
    <div class="row"><label class="btn sm" for="imJson" style="cursor:pointer">📂 นำเข้าไฟล์ .json จาก Card Studio</label><input type="file" id="imJson" accept=".json,application/json" hidden>
      ${userDeckRaw?'<button class="btn sm" id="clrJson">กลับไปใช้ดีไซน์ตั้งต้น</button>':""}</div>
  </div>
  <div class="panel"><h2>ตัวเลือกกติกา</h2>
    <div class="row"><label>ตรวจคู่ผิด</label>${segHTML("check",[["block","บล็อกทันที (ฝึก)"],["challenge","ทักท้วง (แข่ง)"]],S.check)}</div>
    <div class="row"><label>แจกคนละ</label><select id="hand"><option value="auto">อัตโนมัติ (7 · 2 คน = 8)</option>${[5,6,7,8,9,10].map(n=>`<option value="${n}">${n}</option>`).join("")}</select></div>
    <div class="row"><label>เวลาต่อเกม</label><select id="timer"><option value="auto">อัตโนมัติ (2–3 คน 20 นาที · 4–5 คน 30 นาที)</option><option value="0">ไม่จับเวลา</option>${[5,10,15,20,30,45].map(n=>`<option value="${n}">${n} นาที</option>`).join("")}</select></div>
    <div class="row"><label>HP ของ Consult</label>${segHTML("consultHP",[[100,100],[200,200]],S.consultHP)}<span class="tag">ยังเปิดอยู่</span></div>
    <label class="opt"><input type="checkbox" id="stack" ${S.stack?"checked":""}><span>DRAW ซ้อน DRAW ได้<small>ค่าเริ่มต้นในเอกสาร: ปิด</small></span></label>
    <label class="opt"><input type="checkbox" id="lastSpecialWins" ${S.lastSpecialWins?"checked":""}><span>การ์ดพิเศษใบสุดท้ายชนะได้เสมอ <span class="tag">ยังเปิดอยู่</span><small>ปิด = ห้ามลงการ์ดพิเศษเป็นใบสุดท้าย</small></span></label>
    <label class="opt"><input type="checkbox" id="multiPlay" ${S.multiPlay?"checked":""}><span>ลงกองกลางได้หลายครั้งต่อตา <span class="tag">ทางเลือก</span><small>ปิด = ตาละ 1 ครั้ง (แบบ UNO) · เปิด = ลงต่อกันไปได้เรื่อยๆ ในตาเดียว เกมจะจบเร็วขึ้น</small></span></label>
    <label class="opt"><input type="checkbox" id="singleExtra" ${S.singleExtra?"checked":""}><span>Pineal / Parathyroid เพิ่มเป็น 2 ใบ <span class="tag">ถ้าติดบ่อย</span></span></label>
  </div>
  <div class="panel"><h2>การ์ดพิเศษ <span class="tag" id="tot">รวม ${totalCards()} ใบ + Master 1</span></h2>
    <p class="note">Hormone 36 · Gland 36 (เท่าจำนวนฮอร์โมนของแต่ละต่อม) · ค่าเริ่มต้นตามตารางส่วนประกอบในเอกสาร</p>
    <div class="counts">${sp.map(a=>`<div><span>${SP[a].name}</span><input type="number" min="0" max="12" data-c="${a}" value="${S.counts[a]}"></div>`).join("")}</div>
    <div class="row"><button class="btn sm" id="resetC">คืนค่าตามเอกสาร</button></div>
  </div>
  <div class="row" style="justify-content:center"><button class="btn pri" id="bBack2">บันทึกแล้ว · กลับ</button></div>`;
  $("#skill").value=S.skill;$("#speed").value=String(S.speed);$("#hand").value=String(S.hand);$("#timer").value=String(S.timer);
  const segOn=(id,fn)=>$("#"+id).onclick=e=>{const b=e.target.closest("button");if(!b)return;fn(b.dataset.v);saveS();renderSettings()};
  segOn("check",v=>S.check=v);segOn("consultHP",v=>{S.consultHP=+v;artReady=false;Object.keys(HI).forEach(k=>delete HI[k])});
  document.querySelectorAll("[data-c]").forEach(el=>el.oninput=()=>{S.counts[el.dataset.c]=Math.max(0,Math.min(12,+el.value||0));saveS();$("#tot").textContent=`รวม ${totalCards()} ใบ + Master 1`});
  ["stack","lastSpecialWins","multiPlay","singleExtra"].forEach(k=>$("#"+k).onchange=e=>{S[k]=e.target.checked;saveS();$("#tot").textContent=`รวม ${totalCards()} ใบ + Master 1`});
  $("#skill").onchange=e=>{S.skill=e.target.value;saveS()};$("#speed").onchange=e=>{S.speed=+e.target.value;saveS()};$("#think").value=S.think||"normal";$("#think").onchange=e=>{S.think=e.target.value;saveS()};
  $("#hand").onchange=e=>{S.hand=e.target.value;saveS()};$("#timer").onchange=e=>{S.timer=e.target.value;saveS()};
  $("#resetC").onclick=()=>{S.counts={...DEF_COUNTS};saveS();renderSettings()};
  document.querySelectorAll("#pv img").forEach(im=>im.onclick=()=>zoomKey(im.dataset.k));
  $("#imJson").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const fr=new FileReader();fr.onload=async()=>{
    try{const d=JSON.parse(fr.result);if(!Array.isArray(d.cards)||!Array.isArray(d.types))throw 0;
      userDeckRaw=fr.result;userDeckName=f.name;await idb.set("deck",userDeckRaw);await idb.set("deckName",f.name);
      artReady=false;await ensureArt();renderSettings();toast(`ใช้ดีไซน์จาก ${f.name} แล้ว`,true);
    }catch(err){toast("ไฟล์นี้ไม่ใช่ไฟล์สำรับจาก Card Studio")}};fr.readAsText(f)};
  const cj=$("#clrJson");if(cj)cj.onclick=async()=>{userDeckRaw=null;userDeckName="";await idb.set("deck",null);artReady=false;await ensureArt();renderSettings()};
  $("#bRules").onclick=showRules;$("#bBack").onclick=$("#bBack2").onclick=()=>go("mode");
}
(async()=>{
  const raw=await idb.get("deck");if(raw){userDeckRaw=raw;userDeckName=(await idb.get("deckName"))||"ไฟล์ที่นำเข้า"}
  try{const mb=await idb.get("musicBlob");if(mb){customURL=URL.createObjectURL(mb);customName=(await idb.get("musicName"))||"เพลงของคุณ"}}catch(e){}
  const mbtn=document.createElement("button");mbtn.id="mbtn";mbtn.onclick=e=>{e.stopPropagation();openMusic()};document.body.appendChild(mbtn);
  go("splash");
})();
</script>
</body>
